name: Build and publish Pacman repository
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pacman-repository-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            packages: cjson weechat-cjson toot
          - group: servers
            packages: pumpkin-server terraria-server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build native Termux-Pacman packages
        env:
          REPO_REVISION: 1.${{ github.run_number }}.${{ github.run_attempt }}
          BUILD_GROUP: ${{ matrix.group }}
          BUILD_PACKAGES: ${{ matrix.packages }}
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: packages-aarch64-${{ matrix.group }}
          path: dist/
          if-no-files-found: warn
          retention-days: 14
  runtime:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: packages-aarch64-*
          merge-multiple: true
          path: dist/
      - name: Install and exercise packages in aarch64 Termux-Pacman
        run: |
          set -euo pipefail
          docker run --rm --user 1000:1000 \
            -v "$PWD/dist:/packages:ro" -v "$PWD/scripts:/tests:ro" \
            --entrypoint /data/data/com.termux/files/usr/bin/bash \
            termux/termux-docker-pacman@sha256:489fa5abfae9244b1c5229cdff6b77007846d7ab7a028768ce1c92967c7999e4 \
            /tests/runtime-test.sh | tee runtime-test.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: runtime-evidence-aarch64
          path: runtime-test.log
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: packages-aarch64-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: runtime-evidence-aarch64
          path: dist/evidence/
      - name: Install Pacman repository tools on the Ubuntu runner
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pacman-package-manager makepkg libarchive-tools
      - name: Assemble, sign when configured, and publish a verified snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          REPO_SIGNING_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
        run: |
          python3 scripts/verify-packages.py dist
          bash scripts/publish.sh
