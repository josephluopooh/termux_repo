name: Build and publish Pacman repository
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pacman-repository-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build native Termux-Pacman packages
        env:
          REPO_REVISION: 1.${{ github.run_number }}.${{ github.run_attempt }}
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-aarch64
          path: dist/
          if-no-files-found: error
          retention-days: 14
