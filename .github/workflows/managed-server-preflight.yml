name: Native managed-server package preflight
on:
  push:
    branches: [packaging/tshock-native-preflight]
    paths:
      - 'packages/terraria-managed-support/**'
      - 'packages/tshock-server/**'
      - 'scripts/tshock-server-smoke-test.py'
      - '.github/workflows/managed-server-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Select only the unpublished managed-server candidates for this preflight
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('packages.json').write_text(json.dumps({'packages': ['terraria-managed-support', 'tshock-server']}) + '\n')
          PY
      - name: Build actual Pacman packages and verify ABI and notices
        env:
          BUILD_PACKAGES: terraria-managed-support tshock-server
          BUILD_GROUP: managed-server
          REPO_REVISION: 0.${{ github.run_number }}.${{ github.run_attempt }}
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: managed-server-preflight-packages
          path: dist/
          retention-days: 14
  runtime:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: managed-server-preflight-packages
          path: dist/
      - name: Install packages, set up upstream server, create and reload a world
        run: |
          set -euo pipefail
          docker run --rm --user 1000:1000 \
            -v "$PWD/dist:/packages:ro" -v "$PWD/scripts:/tests:ro" \
            --entrypoint /data/data/com.termux/files/usr/bin/bash \
            termux/termux-docker-pacman@sha256:489fa5abfae9244b1c5229cdff6b77007846d7ab7a028768ce1c92967c7999e4 \
            -c 'set -euo pipefail; pacman -Syu --noconfirm; pacman -U --noconfirm /packages/*.pkg.tar.xz; python /tests/tshock-server-smoke-test.py' \
            | tee managed-server-runtime.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: managed-server-preflight-evidence
          path: managed-server-runtime.log
          retention-days: 14
